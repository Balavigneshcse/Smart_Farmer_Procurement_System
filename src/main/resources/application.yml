# Local defaults work out of the box with a local PostgreSQL (postgres / postgres).
# On Render, the same keys are overridden with environment variables.
spring:
  application:
    name: smart-farmer-procurement

  # Local secrets (Razorpay keys, Gmail App Password) live in a git-ignored ".env" file in the project folder:
  #   RAZORPAY_KEY_ID=rzp_test_...
  #   RAZORPAY_KEY_SECRET=...
  # On Render the same names are set as environment variables instead.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/farmer_procurement}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      # Small pool: the free Neon database and the 512 MB Render container are both tiny
      maximum-pool-size: 4
      minimum-idle: 0
      idle-timeout: 120000
      max-lifetime: 600000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate

  flyway:
    enabled: true
    connect-retries: 10            # Neon may need a moment to wake up

  # Email texts: messages.properties (English), messages_ta.properties, messages_hi.properties
  messages:
    basename: messages
    fallback-to-system-locale: false

  # Pages, scripts, styles, language files and pictures: the browser keeps a copy and only asks "changed?"
  # (answer 304, nothing re-sent), so pages open much faster on the slow free server, and a new deploy is
  # still picked up at once. API answers stay "no-store" (Spring Security), so private data is never kept.
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true

  # Gmail SMTP (used when app.email.provider = smtp). Render's free plan blocks these ports,
  # so the deployed site sends through a Google Apps Script over HTTPS instead (google-script).
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": true
      "[mail.smtp.connectiontimeout]": 10000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000

management:
  health:
    # /actuator/health should say whether the app and database are up. It must not wait 10+ seconds
    # trying to reach Gmail (or fail the server's health check when Gmail is slow).
    mail:
      enabled: false

server:
  port: ${PORT:8080}
  # The app runs behind a proxy (Render's, or Nginx on a server). "native" lets Tomcat take the visitor's real
  # IP address and "https" from its X-Forwarded-For / X-Forwarded-Proto headers (trusted only from a private network).
  # The staff login lock counts wrong passwords per real IP address, and Spring Security sends the HSTS
  # header only when it knows the request came in over HTTPS.
  forward-headers-strategy: native
  error:
    include-stacktrace: never
  tomcat:
    threads:
      max: 20
      min-spare: 2
    remoteip:
      # The visitor's address is the first one in X-Forwarded-For, read from the right, that is not one of these
      # proxies: private networks (Render's own proxy, or Nginx on the same server) and Cloudflare, which sits in
      # front of Render. Without the Cloudflare ranges every visitor looked like a Cloudflare address, and the
      # per-IP limits and the staff login lock counted many people as one. Reading from the right means a visitor
      # cannot fake it. Cloudflare's list: https://www.cloudflare.com/ips/ (checked 2026-11-12).
      internal-proxies: "10.0.0.0/8,192.168.0.0/16,169.254.0.0/16,127.0.0.0/8,100.64.0.0/10,172.16.0.0/12,::1/128,fe80::/10,fc00::/7,173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
  # Text files are sent compressed: the pages load much faster on slow mobile networks.
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: text/html,text/css,application/javascript,text/javascript,application/json,image/svg+xml

app:
  name: Smart Farmer Procurement System

  # Key that encrypts farmers' bank account numbers and UPI IDs in the database.
  # Set PAYOUT_ENCRYPTION_KEY (32+ random characters) in .env and on the server. The default is for local
  # development only: when APP_URL is not http://localhost or http://127.0.0.1 the app refuses to start with it.
  # Do not change it later: values saved with the old key could not be read any more.
  payout-encryption-key: ${PAYOUT_ENCRYPTION_KEY:local-dev-payout-key-change-me-0123456789}

  jwt:
    # Set JWT_SECRET (32+ random characters) on the server. The default is for local development only:
    # when APP_URL is not http://localhost or http://127.0.0.1 the app refuses to start with it.
    secret: ${JWT_SECRET:local-dev-secret-change-me-on-render-0123456789}
    farmer-expiry-hours: 168          # farmers stay logged in for 7 days (fewer OTP emails)
    staff-expiry-hours: 12
    registration-expiry-minutes: 15

  otp:
    valid-minutes: 5
    max-attempts: 3
    resend-seconds: 60
    max-per-hour: 5                    # per email address
    # OTP emails per day for all addresses together, so a script trying made-up addresses cannot use up
    # the email quota. Gmail allows about 500 a day = 250 notification emails + 200 OTPs + some margin.
    max-per-day: ${OTP_DAILY_LIMIT:200}

  staff-login:
    max-attempts: 5                    # wrong passwords in a row (per username and IP address) before a lock
    lock-minutes: 15                   # locked this long from that address (or until an admin sets a new password)

  email:
    provider: ${EMAIL_PROVIDER:console}   # console = print in the log, smtp = Gmail, google-script = Gmail via Apps Script (Render), brevo = Brevo API
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    from-name: Smart Farmer Procurement System
    daily-limit: ${EMAIL_DAILY_LIMIT:250}  # notification emails per day (Gmail allows 500, Brevo 300); OTPs: app.otp.max-per-day
    # Links inside emails; not localhost = real secrets required. Render sets RENDER_EXTERNAL_URL itself.
    app-url: ${APP_URL:${RENDER_EXTERNAL_URL:http://localhost:8080}}

  booking:
    days-ahead: 7                      # today + the next 6 days can be booked
    reminder-before-minutes: 120       # reminder email about 2 hours before the slot starts

  queue:
    late-grace-minutes: 15             # checked in later than slot end + 15 min = back of the queue
    no-show-after-minutes: 120         # not checked in by slot end + 2 h = marked as missed (NO_SHOW)

  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}        # must be a TEST key (rzp_test_...); live keys are refused
    key-secret: ${RAZORPAY_KEY_SECRET:}
    api-url: https://api.razorpay.com/v1
    # Test accounts refuse large payments (UPI: at most Rs 1,00,000). A bigger farmer payment is charged
    # through Razorpay as this stand-in amount (Rs 50,000) and recorded as paid in full.
    test-charge-limit-paise: 5000000
