# Local defaults work out of the box with a local PostgreSQL (postgres / postgres).
# On Render, the same keys are overridden with environment variables.
spring:
  application:
    name: smart-farmer-procurement

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/farmer_procurement}
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 5

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate

  flyway:
    enabled: true

  # SMS texts: messages.properties (English), messages_ta.properties, messages_hi.properties
  messages:
    basename: messages
    fallback-to-system-locale: false

server:
  port: ${PORT:8080}

app:
  name: Smart Farmer Procurement System

  jwt:
    # Set JWT_SECRET (32+ random characters) on Render. The default is for local development only.
    secret: ${JWT_SECRET:local-dev-secret-change-me-on-render-0123456789}
    farmer-expiry-hours: 168          # farmers stay logged in for 7 days (fewer OTP SMS)
    staff-expiry-hours: 12
    registration-expiry-minutes: 15

  otp:
    valid-minutes: 5
    max-attempts: 3
    resend-seconds: 60
    max-per-hour: 5

  sms:
    provider: ${SMS_PROVIDER:console}  # console = print in log, textbee = real SMS (M6)

  booking:
    days-ahead: 7                      # today + the next 6 days can be booked
