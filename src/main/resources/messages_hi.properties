# Email and notification texts in Hindi. The values {0}, {1} ... are the same as in messages.properties.

notify.app-name=स्मार्ट किसान खरीद प्रणाली
notify.greeting=नमस्ते {0},
notify.button=मेरी बुकिंग खोलें
notify.qr=चेक-इन डेस्क पर यह QR कोड या अपना टोकन दिखाएँ।
notify.footer=आपको यह ईमेल इसलिए मिला है क्योंकि आपने स्मार्ट किसान खरीद प्रणाली में पंजीकरण किया है। कृपया इस ईमेल का उत्तर न दें।

notify.otp.subject={0} आपका लॉगिन OTP है
notify.otp.text=स्मार्ट किसान खरीद प्रणाली में लॉग इन करने के लिए इस OTP का उपयोग करें। यह {1} मिनट तक मान्य है। इसे किसी के साथ साझा न करें, केंद्र के कर्मचारियों के साथ भी नहीं।
notify.otp.footer=अगर आपने लॉग इन करने की कोशिश नहीं की है, तो इस ईमेल को अनदेखा कर सकते हैं।

notify.booking-confirmed.subject=बुकिंग पक्की - टोकन {0}
notify.booking-confirmed.text={1} में {2}, {3} के लिए आपका स्लॉट बुक हो गया है। फसल: {4}। आपका टोकन {0} है। केंद्र पर अपने बुकिंग पेज का QR कोड दिखाएँ या अपना टोकन बताएँ।

notify.booking-cancelled.subject=बुकिंग रद्द - टोकन {0}
notify.booking-cancelled.text={1} में {2}, {3} की आपकी बुकिंग {0} रद्द कर दी गई है। जब आप तैयार हों, दूसरा समय बुक कर सकते हैं।

notify.reminder.subject=याद दिलाना: टोकन {0} आज, {3}
notify.reminder.text={1} में आपका स्लॉट आज {3} है। टोकन {0}, फसल: {4}। कृपया सूखी और साफ फसल के साथ समय पर आएँ।

notify.checked-in.subject=चेक-इन हो गया - टोकन {0}
notify.checked-in.text={1} में आपका चेक-इन हो गया है। कतार में आपका नंबर {5} है। अनुमानित इंतज़ार: लगभग {6} मिनट। TV स्क्रीन या अपना बुकिंग पेज देखते रहें।

notify.turn-near.subject=आपकी बारी नज़दीक है - टोकन {0}
notify.turn-near.text={1} में आपकी बारी जल्द आने वाली है। कतार में आपका नंबर {5} है, लगभग {6} मिनट बाकी हैं। कृपया अपनी फसल के साथ काउंटर के पास रहें।

notify.called.subject=अभी काउंटर {5} पर जाएँ
notify.called.text=टोकन {0}: कृपया अपनी फसल के साथ अभी काउंटर {5} पर जाएँ।

notify.procured.subject=फसल स्वीकार - टोकन {0}
notify.procured.text={1} में आपकी फसल स्वीकार कर ली गई है। फसल: {4}। वज़न: {5} क्विंटल। राशि: {6}। भुगतान जल्द ही आपको कर दिया जाएगा।

notify.rejected.subject=फसल स्वीकार नहीं हुई - टोकन {0}
notify.rejected.text=क्षमा करें, {1} में आपकी फसल स्वीकार नहीं की गई। फसल: {4}। कारण: {5}। समस्या ठीक करने के बाद आप नया स्लॉट बुक कर सकते हैं।

notify.paid.subject=भुगतान हो गया - {5}
notify.paid.text=आपकी फसल के लिए {5} का भुगतान कर दिया गया है। टोकन {0}, फसल: {4}। भुगतान संदर्भ: {6}।

notify.no-show.subject=स्लॉट छूट गया - टोकन {0}
notify.no-show.text=आप {2}, {3} के अपने स्लॉट (टोकन {0}) के लिए {1} नहीं आए, इसलिए बुकिंग बंद कर दी गई है। तैयार होने पर कृपया नया स्लॉट बुक करें।
