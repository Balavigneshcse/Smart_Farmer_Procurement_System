<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My booking | Smart Farmer Procurement System</title>
    <meta name="theme-color" content="#1d6a40">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preload" href="/fonts/anek-latin.woff2" as="font" type="font/woff2" crossorigin>
    <script src="/js/theme.js"></script>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<header class="site-header">
    <div class="container header-row">
        <a class="brand" href="/farmer/dashboard.html">
            <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="/img/icons.svg#grains"></use></svg></span>
            <span class="brand-text">Smart Farmer <small>Procurement System</small></span>
        </a>
        <div class="header-actions">
            <div class="lang-switch" role="group" aria-label="Language">
                <button type="button" data-lang="en" aria-pressed="true">English</button>
                <button type="button" data-lang="ta" aria-pressed="false">தமிழ்</button>
                <button type="button" data-lang="hi" aria-pressed="false">हिन्दी</button>
            </div>
            <button type="button" class="theme-toggle" aria-label="Switch to dark theme"><svg class="icon icon-moon" aria-hidden="true"><use href="/img/icons.svg#moon"></use></svg><svg class="icon icon-sun" aria-hidden="true"><use href="/img/icons.svg#sun"></use></svg></button>
            <button type="button" class="btn btn-quiet btn-sm" id="logout-btn"><svg class="icon" aria-hidden="true"><use href="/img/icons.svg#sign-out"></use></svg><span class="btn-label-wide" data-i18n="common.logout">Log out</span></button>
        </div>
    </div>
</header>

<main id="main" class="container">
    <a class="back-link" href="/farmer/dashboard.html"><svg class="icon" aria-hidden="true"><use href="/img/icons.svg#arrow-left"></use></svg><span data-i18n="booking.back">My bookings</span></a>
    <div class="page-head compact">
        <h1 data-i18n="booking.title">My booking</h1>
    </div>

    <div id="alert" class="alert hidden" role="alert"></div>

    <div class="booking-layout hidden" id="content">
        <!-- Live queue first, full width: on a phone the farmer sees "go to counter" without scrolling -->
        <section class="card hidden live-card" id="live" aria-live="polite">
            <div class="live-head">
                <h2><span class="live-dot"></span><span data-i18n="live.title">Live queue</span></h2>
                <span class="small muted" id="live-updated"></span>
            </div>
            <div id="live-body"></div>
        </section>

        <div class="stack">
            <div class="ticket">
                <div class="ticket-top">
                    <div class="ticket-label"><svg class="icon" aria-hidden="true"><use href="/img/icons.svg#ticket"></use></svg><span data-i18n="booking.token">Token</span></div>
                    <div class="token" id="token"></div>
                </div>
                <div class="ticket-body">
                    <div id="status"></div>
                    <div id="qr-block" class="qr-block">
                        <div class="qr" id="qr"></div>
                        <p class="qr-note" data-i18n="booking.showAtCounter">Show this at the counter</p>
                    </div>
                </div>
            </div>
            <button type="button" class="btn btn-danger btn-block hidden" id="cancel-btn"><svg class="icon" aria-hidden="true"><use href="/img/icons.svg#x-circle"></use></svg><span data-i18n="booking.cancel">Cancel booking</span></button>
        </div>

        <div class="stack">
            <section class="card hidden" id="result-card" aria-labelledby="result-title">
                <h2 id="result-title" data-i18n="result.title">Weighment result</h2>
                <div id="result"></div>
            </section>
            <section class="card">
                <dl class="details" id="details"></dl>
            </section>
            <section class="card">
                <h2 data-i18n="booking.timeline">Status history</h2>
                <ol class="timeline" id="timeline"></ol>
            </section>
        </div>
    </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
        integrity="sha384-3zSEDfvllQohrq0PHL1fOXJuC/jSOO34H46t6UQfobFOmxE5BpjjaIJY5F2/bMnU" crossorigin="anonymous"></script>
<script src="/js/ui.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script src="/js/farmer.js"></script>
<script src="/js/live.js"></script>
<script src="/js/pages/farmer-booking.js"></script>
</body>
</html>
