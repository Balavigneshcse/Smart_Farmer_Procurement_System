<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My booking · Smart Farmer Procurement System</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<header class="site-header">
    <div class="container header-row">
        <a class="brand" href="/farmer/dashboard.html">
            <span class="brand-mark">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 21V11"/>
                    <path d="M12 11C12 7 9 4 4 4c0 4 3 7 8 7z"/>
                    <path d="M12 14c0-4 3-7 8-7 0 4-3 7-8 7z"/>
                </svg>
            </span>
            <span class="brand-text">Smart Farmer Procurement System</span>
        </a>
        <div class="header-actions">
            <div class="lang-switch" role="group" aria-label="Language">
                <button type="button" data-lang="en" aria-pressed="true">English</button>
                <button type="button" data-lang="ta" aria-pressed="false">தமிழ்</button>
                <button type="button" data-lang="hi" aria-pressed="false">हिन्दी</button>
            </div>
            <button type="button" class="btn btn-outline btn-sm" id="logout-btn" data-i18n="common.logout">Log out</button>
        </div>
    </div>
</header>

<main class="container">
    <a class="back-link" href="/farmer/dashboard.html">← <span data-i18n="booking.back">My bookings</span></a>
    <div class="page-head">
        <h1 data-i18n="booking.title">My booking</h1>
    </div>

    <div id="alert" class="alert hidden" role="alert"></div>

    <div class="booking-layout hidden" id="content">
        <!-- Live queue first, full width: on a phone the farmer sees "go to counter" without scrolling -->
        <section class="card hidden live-card" id="live" aria-live="polite">
            <div class="live-head">
                <h2><span class="live-dot"></span><span data-i18n="live.title">Live queue</span></h2>
                <span class="small muted" id="live-updated"></span>
            </div>
            <div id="live-body"></div>
        </section>

        <div class="stack">
            <div class="token-card">
                <div id="status"></div>
                <div class="muted small" style="margin-top: 12px" data-i18n="booking.token">Token</div>
                <div class="token" id="token"></div>
                <div id="qr-block">
                    <div class="qr" id="qr"></div>
                    <p class="small muted" style="text-align: center; margin: 0" data-i18n="booking.showAtCounter">Show this at the counter</p>
                </div>
            </div>
            <button type="button" class="btn btn-danger btn-block hidden" id="cancel-btn" data-i18n="booking.cancel">Cancel booking</button>
        </div>

        <div class="stack">
            <section class="card hidden" id="result-card" aria-labelledby="result-title">
                <h2 id="result-title" data-i18n="result.title">Weighment result</h2>
                <div id="result"></div>
            </section>
            <section class="card">
                <dl class="details" id="details"></dl>
            </section>
            <section class="card">
                <h2 data-i18n="booking.timeline">Status history</h2>
                <ol class="timeline" id="timeline"></ol>
            </section>
        </div>
    </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script src="/js/farmer.js"></script>
<script>
    const $ = id => document.getElementById(id);
    const { esc } = Farmer;
    const t = (key, params) => I18N.t(key, params);
    const bookingId = Number(new URLSearchParams(location.search).get('id'));
    let booking = null;
    let qrShownFor = null;

    function showAlert(text, type = 'error') {
        $('alert').textContent = text;
        $('alert').className = `alert alert-${type}`;
    }

    function render() {
        if (!booking) return;
        const b = booking;
        $('status').innerHTML = Farmer.statusBadge(b.status);
        $('token').textContent = b.token;

        // The QR is only useful while the booking is still active.
        const active = Farmer.isActive(b.status);
        $('qr-block').classList.toggle('hidden', !active);
        if (active && qrShownFor !== b.qrText) {
            Farmer.renderQr($('qr'), b.qrText);
            qrShownFor = b.qrText;
        }

        $('details').innerHTML = `
            <dt>${esc(t('booking.date'))}</dt><dd>${esc(Farmer.dayLabel(b.date))}</dd>
            <dt>${esc(t('booking.time'))}</dt><dd>${esc(Farmer.slotTime(b.startTime, b.endTime))}</dd>
            <dt>${esc(t('booking.centre'))}</dt><dd>${esc(b.centre.name)}<br><span class="muted small">${esc(b.centre.address)}</span></dd>
            <dt>${esc(t('booking.crop'))}</dt><dd>${esc(Farmer.cropName(b.crop))}</dd>
            <dt>${esc(t('booking.quantity'))}</dt><dd>${esc(Farmer.quantity(b.estQtyQtl))}</dd>
            <dt>${esc(t('booking.estimate'))}</dt><dd>${esc(I18N.formatMoney(b.estAmount))}</dd>`;

        // Newest event at the top.
        $('timeline').innerHTML = [...(b.events || [])].reverse().map(e => `
            <li>
                <strong>${esc(t(`event.${e.event}`))}</strong>
                <time datetime="${esc(e.at)}">${esc(I18N.formatDateTime(e.at))}</time>
            </li>`).join('');

        $('cancel-btn').classList.toggle('hidden', !b.cancellable);
        renderResult();
        $('content').classList.remove('hidden');
        updateLive();
    }

    /** Weighment result and payment, once the crop has been weighed at the counter. */
    function renderResult() {
        const p = booking.procurement;
        $('result-card').classList.toggle('hidden', !p);
        if (!p) return;

        const number = (n, digits) => new Intl.NumberFormat(I18N.locale(), { maximumFractionDigits: digits }).format(n);
        const measured = `
            <dt>${esc(t('result.weight'))}</dt><dd>${esc(Farmer.quantity(p.weightQtl))}</dd>
            <dt>${esc(t('result.moisture'))}</dt><dd>${esc(number(p.moisturePct, 1))}%</dd>
            <dt>${esc(t('result.grade'))}</dt><dd>${esc(p.grade)}</dd>`;

        if (!p.accepted) {
            $('result').innerHTML = `
                <div class="alert alert-error">
                    <strong>${esc(t('result.rejected'))}</strong><br>${esc(t('result.reason', { reason: p.remarks }))}
                </div>
                <dl class="details">${measured}</dl>`;
            return;
        }

        const pay = booking.payment;
        let paymentHtml = '';
        if (pay) {
            paymentHtml = `
                <h3 style="margin-top: 20px">${esc(t('payment.title'))}</h3>
                <p>${Farmer.paymentBadge(pay)}</p>
                ${pay.status === 'PAID'
                    ? `<p class="small muted" style="margin: 0">${esc(t('payment.paidOn', { date: I18N.formatDateTime(pay.paidAt) }))}<br>
                         ${esc(t('payment.reference', { ref: pay.reference }))}</p>`
                    : `<p class="small muted" style="margin: 0">${esc(t('payment.pendingNote'))}</p>`}`;
        }
        $('result').innerHTML = `
            <dl class="details">
                ${measured}
                <dt>${esc(t('result.rate'))}</dt><dd>${esc(t('book.ratePerQtl', { rate: I18N.formatMoney(p.ratePerQtl) }))}</dd>
                <dt>${esc(t('result.amount'))}</dt><dd class="estimate" style="margin: 0">${esc(I18N.formatMoney(p.amount))}</dd>
            </dl>
            ${paymentHtml}`;
    }

    // ---------- Live queue (only on the day of the booking, while it is active) ----------

    let source = null;
    let snapshot = null;
    let reloadTimer = null;
    let announcedCounter = null;

    function isLiveDay() {
        return booking && booking.date === Farmer.todayIso() && Farmer.isActive(booking.status);
    }

    function updateLive() {
        if (!isLiveDay()) {
            source?.close();
            source = null;
            $('live').classList.add('hidden');
            return;
        }
        $('live').classList.remove('hidden');
        if (!source) {
            source = new EventSource(`/api/queue/${booking.centre.id}/stream`);
            source.addEventListener('queue', event => {
                snapshot = JSON.parse(event.data);
                renderLive();
                syncStatus();
            });
            source.addEventListener('error', () => {
                $('live-updated').textContent = t('live.reconnecting');
            });
        }
        renderLive();
    }

    /** Where is this farmer's token in the public queue? */
    function liveState() {
        const serving = snapshot.serving.find(s => s.token === booking.token);
        if (serving) return { status: 'CALLED', counterNo: serving.counterNo };
        const waiting = snapshot.waiting.find(w => w.token === booking.token);
        if (waiting) return { status: 'CHECKED_IN', position: waiting.position, eta: waiting.etaMinutes };
        return { status: 'NOT_IN_QUEUE' };
    }

    function renderLive() {
        if (!snapshot) {
            $('live-body').innerHTML = `<p class="muted">${esc(t('common.loading'))}</p>`;
            return;
        }
        const state = liveState();
        if (state.status === 'CALLED') {
            $('live-body').innerHTML = `<div class="live-called">${esc(t('live.goToCounter', { n: state.counterNo }))}</div>`;
            if (announcedCounter !== state.counterNo) {
                announcedCounter = state.counterNo;
                navigator.vibrate?.([400, 150, 400]);
            }
        } else if (state.status === 'CHECKED_IN') {
            announcedCounter = null;
            const ahead = state.position - 1;
            $('live-body').innerHTML = `
                <div class="token-stats">
                    <div class="stat">
                        <div class="stat-label">${esc(t('live.position'))}</div>
                        <div class="stat-value">${state.position}</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">${esc(t('live.eta'))}</div>
                        <div class="stat-value">${esc(state.eta === 0 ? t('live.now') : t('live.minutes', { n: state.eta }))}</div>
                    </div>
                </div>
                <p style="margin: 0">${esc(ahead === 0 ? t('live.next') : t('live.ahead', { n: ahead }))}</p>`;
        } else {
            $('live-body').innerHTML = `
                <p>${esc(t('live.notArrived'))}</p>
                <p class="muted" style="margin: 0">${esc(t('live.waitingNow', { n: snapshot.waiting.length }))}</p>`;
        }
        $('live-updated').textContent = t('live.updated', { time: I18N.formatTime(snapshot.updatedAt.substring(11, 16)) });
    }

    /** If the queue shows a different status than our copy of the booking, reload it (timeline, badge). */
    function syncStatus() {
        const shown = liveState().status;
        const expected = booking.status === 'BOOKED' ? 'NOT_IN_QUEUE' : booking.status;
        if (shown !== expected) {
            clearTimeout(reloadTimer);
            reloadTimer = setTimeout(async () => {
                try {
                    booking = await Api.get(`/api/bookings/${bookingId}`);
                    render();
                } catch {
                    // keep showing what we have; the next update will try again
                }
            }, 300);
        }
    }

    $('cancel-btn').addEventListener('click', async () => {
        if (!confirm(t('booking.cancelConfirm'))) return;
        const button = $('cancel-btn');
        button.disabled = true;
        try {
            booking = await Api.post(`/api/bookings/${bookingId}/cancel`);
            render();
            showAlert(t('booking.cancelled'), 'success');
        } catch (error) {
            showAlert(Api.errorMessage(error));
        } finally {
            button.disabled = false;
        }
    });

    document.addEventListener('langchange', render);

    async function init() {
        const me = await Farmer.initPage();
        if (!me) return;
        if (!bookingId) {
            location.replace('/farmer/dashboard.html');
            return;
        }
        try {
            booking = await Api.get(`/api/bookings/${bookingId}`);
            render();
        } catch (error) {
            showAlert(Api.errorMessage(error));
        }
    }

    init();
</script>
</body>
</html>
