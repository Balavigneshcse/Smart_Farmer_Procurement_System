<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Farmer login | Smart Farmer Procurement System</title>
    <meta name="theme-color" content="#1d6a40">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preload" href="/fonts/anek-latin.woff2" as="font" type="font/woff2" crossorigin>
    <script src="/js/theme.js"></script>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<header class="site-header">
    <div class="container header-row">
        <a class="brand" href="/">
            <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="/img/icons.svg#grains"></use></svg></span>
            <span class="brand-text">Smart Farmer <small>Procurement System</small></span>
        </a>
        <div class="header-tools">
            <div class="lang-switch" role="group" aria-label="Language">
                <button type="button" data-lang="en" aria-pressed="true">English</button>
                <button type="button" data-lang="ta" aria-pressed="false">தமிழ்</button>
                <button type="button" data-lang="hi" aria-pressed="false">हिन्दी</button>
            </div>
            <button type="button" class="theme-toggle" aria-label="Switch to dark theme"><svg class="icon icon-moon" aria-hidden="true"><use href="/img/icons.svg#moon"></use></svg><svg class="icon icon-sun" aria-hidden="true"><use href="/img/icons.svg#sun"></use></svg></button>
        </div>
    </div>
</header>

<main id="main" class="container auth-layout">
    <div class="auth-panel">
    <div class="card auth-card">
        <div id="alert" class="alert hidden" role="alert"></div>

        <!-- Step 1: email address -->
        <form id="email-form" novalidate>
            <span class="auth-icon"><svg class="icon" aria-hidden="true"><use href="/img/icons.svg#envelope-simple"></use></svg></span>
            <h1 class="auth-title" data-i18n="login.title">Farmer login</h1>
            <p class="muted" data-i18n="login.subtitle">Enter your email address. We will email you a one-time password (OTP).</p>
            <div class="field">
                <label for="email" data-i18n="login.email">Email address</label>
                <input id="email" type="email" inputmode="email" autocomplete="email" maxlength="254"
                       autocapitalize="off" spellcheck="false"
                       data-i18n-placeholder="login.email.placeholder" aria-describedby="email-error">
                <p class="field-error" id="email-error"></p>
            </div>
            <button class="btn btn-primary btn-lg btn-block" type="submit" id="send-btn" data-i18n="login.sendOtp">Send OTP</button>
        </form>

        <!-- Step 2: OTP -->
        <form id="otp-form" class="hidden" novalidate>
            <span class="auth-icon"><svg class="icon" aria-hidden="true"><use href="/img/icons.svg#seal-check"></use></svg></span>
            <h1 class="auth-title" data-i18n="login.otpTitle">Enter OTP</h1>
            <p class="muted" id="otp-sent-to"></p>
            <p class="small muted" data-i18n="login.checkSpam">Not in your inbox? Check the Spam or Promotions folder.</p>
            <div class="field">
                <label for="otp" data-i18n="login.otp">OTP</label>
                <input id="otp" class="otp-input" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6"
                       data-i18n-placeholder="login.otp.placeholder" aria-describedby="otp-error">
                <p class="field-error" id="otp-error"></p>
            </div>
            <button class="btn btn-primary btn-lg btn-block" type="submit" id="verify-btn" data-i18n="login.verify">Verify and continue</button>
            <div class="auth-links">
                <button type="button" class="link-button" id="resend-btn" disabled></button>
                <button type="button" class="link-button" id="change-btn" data-i18n="login.changeEmail">Change email</button>
            </div>
        </form>
    </div>
    </div>
    <figure class="auth-photo">
        <img src="/img/photos/farmer-field.webp" width="720" height="720" loading="lazy" decoding="async"
             alt="A green tractor in a field under a blue sky" data-i18n-alt="login.photo">
    </figure>
</main>

<script src="/js/ui.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script src="/js/pages/farmer-login.js"></script>
</body>
</html>
