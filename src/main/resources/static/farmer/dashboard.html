<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My dashboard · Smart Farmer Procurement System</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<header class="site-header">
    <div class="container header-row">
        <a class="brand" href="/farmer/dashboard.html">
            <span class="brand-mark">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 21V11"/>
                    <path d="M12 11C12 7 9 4 4 4c0 4 3 7 8 7z"/>
                    <path d="M12 14c0-4 3-7 8-7 0 4-3 7-8 7z"/>
                </svg>
            </span>
            <span class="brand-text">Smart Farmer Procurement System</span>
        </a>
        <div class="header-actions">
            <div class="lang-switch" role="group" aria-label="Language">
                <button type="button" data-lang="en" aria-pressed="true">English</button>
                <button type="button" data-lang="ta" aria-pressed="false">தமிழ்</button>
                <button type="button" data-lang="hi" aria-pressed="false">हिन्दी</button>
            </div>
            <button type="button" class="btn btn-outline btn-sm" id="logout-btn" data-i18n="common.logout">Log out</button>
        </div>
    </div>
</header>

<main class="container">
    <div class="page-head">
        <h1 id="welcome"></h1>
        <p class="muted" data-i18n="dashboard.subtitle">Book slots and track your crop and payment here.</p>
    </div>

    <div id="notice" class="alert hidden" role="status"></div>

    <section class="card" aria-labelledby="profile-title">
        <h2 id="profile-title" data-i18n="dashboard.profile.title">My details</h2>
        <dl class="details" id="profile">
            <dt data-i18n="dashboard.profile.mobile">Mobile</dt>
            <dd id="p-mobile">–</dd>
            <dt data-i18n="dashboard.profile.address">Address</dt>
            <dd id="p-address">–</dd>
            <dt data-i18n="dashboard.profile.district">District</dt>
            <dd id="p-district">–</dd>
            <dt data-i18n="dashboard.profile.aadhaar">Aadhaar</dt>
            <dd id="p-aadhaar">–</dd>
            <dt data-i18n="dashboard.profile.language">Language</dt>
            <dd id="p-language">–</dd>
        </dl>
    </section>
</main>

<script src="/js/i18n.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script>
    const LANGUAGE_NAMES = { en: 'English', ta: 'தமிழ்', hi: 'हिन्दी' };
    const $ = id => document.getElementById(id);
    const me = Auth.require('FARMER');
    let profile = null;
    let noticeTimer = null;

    function showNotice(text, type = 'success') {
        $('notice').textContent = text;
        $('notice').className = `alert alert-${type}`;
        clearTimeout(noticeTimer);
        noticeTimer = setTimeout(() => { $('notice').className = 'alert hidden'; }, 5000);
    }

    function render() {
        const name = profile?.name ?? me.name;
        $('welcome').textContent = I18N.t('dashboard.welcome', { name });
        if (!profile) return;
        $('p-mobile').textContent = `+91 ${profile.mobile}`;
        $('p-address').textContent = profile.address;
        $('p-district').textContent = profile.district;
        $('p-aadhaar').textContent = `XXXX XXXX ${profile.aadhaarLast4}`;
        $('p-language').textContent = LANGUAGE_NAMES[profile.language];
    }

    /** Clicking a language button also saves it, so SMS come in the same language. */
    async function saveLanguage(language) {
        try {
            profile = await Api.put('/api/farmers/me/language', { language });
            Auth.updateUser({ language });
            render();
            showNotice(I18N.t('dashboard.langSaved'));
        } catch (error) {
            showNotice(Api.errorMessage(error), 'error');
        }
    }

    async function init() {
        await I18N.init({ onUserChange: saveLanguage });
        render();
        try {
            profile = await Api.get('/api/farmers/me');
            if (profile.language !== I18N.lang) {
                await I18N.setLang(profile.language);
            }
            render();
        } catch (error) {
            showNotice(Api.errorMessage(error), 'error');
        }
    }

    $('logout-btn').addEventListener('click', Auth.logout);
    document.addEventListener('langchange', render);

    if (me) init();
</script>
</body>
</html>
