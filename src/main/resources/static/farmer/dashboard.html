<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My dashboard · Smart Farmer Procurement System</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="field-bg">

<header class="site-header">
    <div class="container header-row">
        <a class="brand" href="/farmer/dashboard.html">
            <span class="brand-mark">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 21V11"/>
                    <path d="M12 11C12 7 9 4 4 4c0 4 3 7 8 7z"/>
                    <path d="M12 14c0-4 3-7 8-7 0 4-3 7-8 7z"/>
                </svg>
            </span>
            <span class="brand-text">Smart Farmer Procurement System</span>
        </a>
        <div class="header-actions">
            <div class="lang-switch" role="group" aria-label="Language">
                <button type="button" data-lang="en" aria-pressed="true">English</button>
                <button type="button" data-lang="ta" aria-pressed="false">தமிழ்</button>
                <button type="button" data-lang="hi" aria-pressed="false">हिन्दी</button>
            </div>
            <button type="button" class="btn btn-outline btn-sm" id="logout-btn" data-i18n="common.logout">Log out</button>
        </div>
    </div>
</header>

<main class="container">
    <div class="page-head head-row">
        <div>
            <h1 id="welcome"></h1>
            <p class="muted" data-i18n="dashboard.subtitle">Book slots and track your crop and payment here.</p>
        </div>
        <a class="btn btn-primary btn-lg" href="/farmer/book.html" data-i18n="dashboard.bookSlot">Book a slot</a>
    </div>

    <div id="notice" class="alert hidden" role="status"></div>

    <section class="dash-section" aria-labelledby="bookings-title">
        <h2 id="bookings-title" data-i18n="dashboard.bookings.title">My bookings</h2>
        <div id="bookings"><p class="muted" data-i18n="common.loading">Loading…</p></div>
    </section>

    <section class="card dash-section" aria-labelledby="notif-title">
        <div class="head-row notif-head">
            <h2 id="notif-title">
                <span data-i18n="notifications.title">Notifications</span>
                <span class="badge badge-amber hidden" id="unread-count"></span>
            </h2>
            <button type="button" class="btn btn-outline btn-sm hidden" id="read-all-btn"
                    data-i18n="notifications.markAllRead">Mark all as read</button>
        </div>
        <ul class="notif-list" id="notifications"></ul>
        <button type="button" class="link-button hidden" id="more-btn" data-i18n="notifications.showAll">Show all</button>
    </section>

    <section class="card dash-section" aria-labelledby="profile-title">
        <h2 id="profile-title" data-i18n="dashboard.profile.title">My details</h2>
        <dl class="details">
            <dt data-i18n="dashboard.profile.email">Email</dt>
            <dd id="p-email">–</dd>
            <dt data-i18n="dashboard.profile.mobile">Mobile</dt>
            <dd id="p-mobile">–</dd>
            <dt data-i18n="dashboard.profile.address">Address</dt>
            <dd id="p-address">–</dd>
            <dt data-i18n="dashboard.profile.district">District</dt>
            <dd id="p-district">–</dd>
            <dt data-i18n="dashboard.profile.aadhaar">Aadhaar</dt>
            <dd id="p-aadhaar">–</dd>
            <dt data-i18n="dashboard.profile.language">Language</dt>
            <dd id="p-language">–</dd>
        </dl>
    </section>
</main>

<script src="/js/i18n.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script src="/js/farmer.js"></script>
<script>
    const LANGUAGE_NAMES = { en: 'English', ta: 'தமிழ்', hi: 'हिन्दी' };
    const $ = id => document.getElementById(id);
    const { esc } = Farmer;
    let me = null;
    let profile = null;
    let bookings = null;
    let notifications = null;
    let showAllNotifications = false;
    let noticeTimer = null;
    const NOTIFICATIONS_SHOWN = 3;

    function showNotice(text, type = 'success') {
        $('notice').textContent = text;
        $('notice').className = `alert alert-${type}`;
        clearTimeout(noticeTimer);
        noticeTimer = setTimeout(() => { $('notice').className = 'alert hidden'; }, 5000);
    }

    function renderProfile() {
        if (!me) return;   // the page language can switch before the farmer is known
        $('welcome').textContent = I18N.t('dashboard.welcome', { name: profile?.name ?? me.name });
        if (!profile) return;
        $('p-email').textContent = profile.email;
        $('p-mobile').textContent = `+91 ${profile.mobile}`;
        $('p-address').textContent = profile.address;
        $('p-district').textContent = profile.district;
        $('p-aadhaar').textContent = `XXXX XXXX ${profile.aadhaarLast4}`;
        $('p-language').textContent = LANGUAGE_NAMES[profile.language];
    }

    function bookingItem(b) {
        return `
            <a class="card booking-item" href="/farmer/booking.html?id=${b.id}">
                <div>
                    <div class="token-sm">${esc(b.token)}</div>
                    ${Farmer.statusBadge(b.status)}
                    ${b.payment ? `<div style="margin-top: 4px">${Farmer.paymentBadge(b.payment)}</div>` : ''}
                </div>
                <div>
                    <strong>${esc(Farmer.dayLabel(b.date))} · ${esc(Farmer.slotTime(b.startTime, b.endTime))}</strong><br>
                    <span class="muted small">${esc(b.centre.name)} · ${esc(Farmer.cropName(b.crop))} · ${esc(Farmer.quantity(b.estQtyQtl))}</span>
                </div>
                <span class="booking-item-go" aria-hidden="true">›</span>
            </a>`;
    }

    function renderBookings() {
        if (!bookings) return;
        if (!bookings.length) {
            $('bookings').innerHTML = `
                <div class="card">
                    <p>${esc(I18N.t('dashboard.bookings.empty'))}</p>
                    <a class="btn btn-primary" href="/farmer/book.html">${esc(I18N.t('dashboard.bookSlot'))}</a>
                </div>`;
            return;
        }
        // Current bookings first (soonest first), then earlier ones (newest first).
        const current = bookings.filter(b => Farmer.isActive(b.status))
            .sort((a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime));
        const earlier = bookings.filter(b => !Farmer.isActive(b.status));

        $('bookings').innerHTML = `
            <div class="booking-list">${current.map(bookingItem).join('')}</div>
            ${earlier.length ? `
                <h3 class="list-heading">${esc(I18N.t('dashboard.bookings.past'))}</h3>
                <div class="booking-list">${earlier.map(bookingItem).join('')}</div>` : ''}`;
    }

    // Subject and message are saved in the farmer's language when the notification is created.
    function notificationItem(n) {
        const href = n.bookingId ? `/farmer/booking.html?id=${n.bookingId}` : '/farmer/dashboard.html';
        const emailed = n.emailed ? ` · ✉ ${esc(I18N.t('notifications.emailed'))}` : '';
        return `
            <li class="notif-item${n.read ? '' : ' unread'}">
                <a href="${href}">
                    <strong>${esc(n.subject)}</strong>
                    <span>${esc(n.message)}</span>
                    <span class="notif-meta">${esc(I18N.formatDateTime(n.createdAt))}${emailed}</span>
                </a>
            </li>`;
    }

    function renderNotifications() {
        if (!notifications) return;
        const { items, unread } = notifications;
        $('unread-count').textContent = I18N.t('notifications.unread', { n: unread });
        $('unread-count').classList.toggle('hidden', unread === 0);
        $('read-all-btn').classList.toggle('hidden', unread === 0);
        if (!items.length) {
            $('notifications').innerHTML = `<li class="muted">${esc(I18N.t('notifications.empty'))}</li>`;
            $('more-btn').classList.add('hidden');
            return;
        }
        const shown = showAllNotifications ? items : items.slice(0, NOTIFICATIONS_SHOWN);
        $('notifications').innerHTML = shown.map(notificationItem).join('');
        $('more-btn').classList.toggle('hidden', shown.length === items.length);
    }

    function renderAll() {
        renderProfile();
        renderBookings();
        renderNotifications();
    }

    $('more-btn').addEventListener('click', () => {
        showAllNotifications = true;
        renderNotifications();
    });

    $('read-all-btn').addEventListener('click', async () => {
        $('read-all-btn').disabled = true;
        try {
            await Api.post('/api/notifications/read-all');
            notifications.items.forEach(n => { n.read = true; });
            notifications.unread = 0;
            renderNotifications();
        } catch (error) {
            showNotice(Api.errorMessage(error), 'error');
        } finally {
            $('read-all-btn').disabled = false;
        }
    });

    document.addEventListener('langchange', renderAll);
    document.addEventListener('languagesaved', event => {
        if (profile) profile.language = event.detail.language;
        renderProfile();
        showNotice(I18N.t('dashboard.langSaved'));
    });
    document.addEventListener('languagesavefailed', event => showNotice(Api.errorMessage(event.detail.error), 'error'));

    async function init() {
        // Ask for the data straight away, while the page texts (language file) are still loading.
        const loading = Auth.user()?.role === 'FARMER'
            ? Promise.all([Api.get('/api/farmers/me'), Api.get('/api/bookings/my'), Api.get('/api/notifications/my')])
            : null;
        loading?.catch(() => {});   // an error is shown below, once the page is ready
        me = await Farmer.initPage();
        if (!me) return;
        renderProfile();
        try {
            [profile, bookings, notifications] = await loading;
            if (profile.language !== I18N.lang) await I18N.setLang(profile.language);
            renderAll();
        } catch (error) {
            showNotice(Api.errorMessage(error), 'error');
        }
    }

    init();
</script>
</body>
</html>
