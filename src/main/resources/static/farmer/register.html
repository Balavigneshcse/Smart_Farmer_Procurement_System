<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | Smart Farmer Procurement System</title>
    <meta name="theme-color" content="#1d6a40">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preload" href="/fonts/anek-latin.woff2" as="font" type="font/woff2" crossorigin>
    <script src="/js/theme.js"></script>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<header class="site-header">
    <div class="container header-row">
        <a class="brand" href="/">
            <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="/img/icons.svg#grains"></use></svg></span>
            <span class="brand-text">Smart Farmer <small>Procurement System</small></span>
        </a>
        <div class="header-tools">
            <div class="lang-switch" role="group" aria-label="Language">
                <button type="button" data-lang="en" aria-pressed="true">English</button>
                <button type="button" data-lang="ta" aria-pressed="false">தமிழ்</button>
                <button type="button" data-lang="hi" aria-pressed="false">हिन्दी</button>
            </div>
            <button type="button" class="theme-toggle" aria-label="Switch to dark theme"><svg class="icon icon-moon" aria-hidden="true"><use href="/img/icons.svg#moon"></use></svg><svg class="icon icon-sun" aria-hidden="true"><use href="/img/icons.svg#sun"></use></svg></button>
        </div>
    </div>
</header>

<main id="main" class="container auth-wrap">
    <form id="register-form" class="card auth-card" novalidate>
        <h1 class="auth-title" data-i18n="register.title">Create your account</h1>
        <p class="muted" data-i18n="register.subtitle">Just a few details. You only do this once.</p>
        <p class="badge badge-wrap verified-badge" id="email-verified"></p>

        <div id="alert" class="alert hidden" role="alert"></div>

        <fieldset class="field">
            <legend data-i18n="register.language">Language for this app and your emails</legend>
            <div class="choice-group">
                <label class="choice"><input type="radio" name="language" value="en"><span>English</span></label>
                <label class="choice"><input type="radio" name="language" value="ta"><span>தமிழ்</span></label>
                <label class="choice"><input type="radio" name="language" value="hi"><span>हिन्दी</span></label>
            </div>
        </fieldset>

        <div class="field">
            <label for="name" data-i18n="register.name">Full name</label>
            <input id="name" autocomplete="name" maxlength="100" data-i18n-placeholder="register.name.placeholder"
                   aria-describedby="name-error">
            <p class="field-error" id="name-error"></p>
        </div>

        <div class="field">
            <label for="mobile" data-i18n="register.mobile">Mobile number</label>
            <div class="input-group">
                <span class="input-prefix">+91</span>
                <input id="mobile" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="10"
                       data-i18n-placeholder="register.mobile.placeholder" aria-describedby="mobile-hint mobile-error">
            </div>
            <span class="hint" id="mobile-hint" data-i18n="register.mobile.hint">So the centre can call you if needed.</span>
            <p class="field-error" id="mobile-error"></p>
        </div>

        <div class="field">
            <label for="address" data-i18n="register.address">Address</label>
            <textarea id="address" rows="3" maxlength="255" autocomplete="street-address"
                      data-i18n-placeholder="register.address.placeholder" aria-describedby="address-error"></textarea>
            <p class="field-error" id="address-error"></p>
        </div>

        <div class="field">
            <label for="district" data-i18n="register.district">District</label>
            <input id="district" list="districts" maxlength="60" autocomplete="address-level2"
                   data-i18n-placeholder="register.district.placeholder" aria-describedby="district-error">
            <datalist id="districts"></datalist>
            <p class="field-error" id="district-error"></p>
        </div>

        <div class="field">
            <label for="aadhaar" data-i18n="register.aadhaar">Aadhaar number – last 4 digits</label>
            <input id="aadhaar" inputmode="numeric" maxlength="4" autocomplete="off"
                   data-i18n-placeholder="register.aadhaar.placeholder" aria-describedby="aadhaar-hint aadhaar-error">
            <span class="hint" id="aadhaar-hint" data-i18n="register.aadhaar.hint">Only the last 4 digits, to check your identity at the counter. We never ask for the full number.</span>
            <p class="field-error" id="aadhaar-error"></p>
        </div>

        <hr class="form-divider">
        <div id="payout"></div>

        <button class="btn btn-primary btn-lg btn-block" type="submit" id="submit-btn" data-i18n="register.submit">Create account</button>
    </form>
</main>

<script src="/js/ui.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script src="/js/payout.js"></script>
<script>
    const $ = id => document.getElementById(id);
    const pending = Auth.pendingRegistration();

    // This page is only reachable right after verifying a new email address.
    if (!pending?.token) {
        location.replace('/farmer/login.html');
    }

    function showAlert(text) {
        $('alert').textContent = text;
        $('alert').className = 'alert alert-error';
    }

    function setFieldError(inputId, messageKey) {
        $(inputId).setAttribute('aria-invalid', 'true');
        $(`${inputId}-error`).textContent = I18N.t(messageKey);
    }

    function clearFieldErrors() {
        ['name', 'mobile', 'address', 'district', 'aadhaar'].forEach(id => {
            $(id).removeAttribute('aria-invalid');
            $(`${id}-error`).textContent = '';
        });
    }

    /** Returns the form values, or null (with errors shown) if something is missing. */
    function readForm() {
        const values = {
            name: $('name').value.trim(),
            mobile: $('mobile').value.trim(),
            address: $('address').value.trim(),
            district: $('district').value.trim(),
            aadhaarLast4: $('aadhaar').value.trim(),
            language: document.querySelector('input[name="language"]:checked')?.value || I18N.lang,
        };
        const invalid = [];
        if (values.name.length < 2) invalid.push(['name', 'validation.name']);
        if (!/^[6-9]\d{9}$/.test(values.mobile)) invalid.push(['mobile', 'validation.mobile']);
        if (!values.address) invalid.push(['address', 'validation.address']);
        if (!values.district) invalid.push(['district', 'validation.district']);
        if (!/^\d{4}$/.test(values.aadhaarLast4)) invalid.push(['aadhaar', 'validation.aadhaar']);

        invalid.forEach(([id, key]) => setFieldError(id, key));
        if (invalid.length) {
            $(invalid[0][0]).focus();
            return null;
        }
        return values;
    }

    function renderEmail() {
        $('email-verified').replaceChildren();
        $('email-verified').insertAdjacentHTML('afterbegin', UI.icon('seal-check'));
        $('email-verified').append(I18N.t('register.emailVerified', { email: pending?.email ?? '' }));
    }

    // Picking a language switches the page straight away.
    document.querySelectorAll('input[name="language"]').forEach(radio => {
        radio.addEventListener('change', () => I18N.setLang(radio.value));
    });

    document.addEventListener('langchange', () => {
        renderEmail();
        const radio = document.querySelector(`input[name="language"][value="${I18N.lang}"]`);
        if (radio) radio.checked = true;
    });

    // Only digits in the number fields.
    ['mobile', 'aadhaar'].forEach(id => $(id).addEventListener('input', event => {
        event.target.value = event.target.value.replace(/\D/g, '');
    }));

    $('register-form').addEventListener('submit', async event => {
        event.preventDefault();
        clearFieldErrors();
        $('alert').className = 'alert hidden';
        const values = readForm();
        const payout = Payout.read();      // both are checked, so every mistake shows at once
        if (!values || !payout) {
            if (!values) $(document.querySelector('#register-form [aria-invalid]').id).focus();
            return;
        }
        values.payout = payout;

        const button = $('submit-btn');
        button.disabled = true;
        button.textContent = I18N.t('register.submitting');
        try {
            const result = await Api.post('/api/auth/register', { registrationToken: pending.token, ...values });
            Auth.save(result.token, result.user);
            Auth.clearPendingRegistration();
            location.replace(pending.next || '/farmer/dashboard.html');
        } catch (error) {
            showAlert(Api.errorMessage(error));
            if (error.code === 'REGISTRATION_EXPIRED' || error.code === 'ALREADY_REGISTERED') {
                Auth.clearPendingRegistration();
                setTimeout(() => location.replace('/farmer/login.html'), 3000);
            }
            button.disabled = false;
            button.textContent = I18N.t('register.submit');
        }
    });

    async function loadDistrictSuggestions() {
        try {
            const centres = await Api.get('/api/centres');
            const districts = [...new Set(centres.map(c => c.district))].sort();
            $('districts').replaceChildren(...districts.map(d => new Option(d)));
        } catch {
            // Suggestions are optional - the farmer can still type their district.
        }
    }

    if (pending?.token) {
        I18N.init().then(() => {
            Payout.render($('payout'));
            renderEmail();
            loadDistrictSuggestions();
            $('name').focus();
        });
    }
</script>
</body>
</html>
