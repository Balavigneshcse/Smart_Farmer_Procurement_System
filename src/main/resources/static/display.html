<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Queue display | Smart Farmer Procurement System</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preload" href="/fonts/geist-mono.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/css/app.css">
    <style>
        /* TV board: always dark (the page sets data-theme="dark"), very large type, never scrolls at 16:9 */
        body.tv { min-height: 100dvh; }
        .tv-wrap { padding: 2.4vh 3vw; display: flex; flex-direction: column; gap: 2.4vh; height: 100dvh; overflow: hidden; }
        .tv-head { display: flex; justify-content: space-between; align-items: center; gap: 16px 32px; flex-wrap: wrap; }
        .tv-head-right { display: flex; align-items: center; gap: 2.6vw; flex-wrap: wrap; }
        .tv-centre { font-size: clamp(1.4rem, 3vw, 2.8rem); font-weight: 700; line-height: 1.15; }
        .tv-sub { color: var(--muted); font-size: clamp(.9rem, 1.2vw, 1.2rem); }
        .tv-clock { font-family: var(--font-mono); font-size: clamp(1.6rem, 3.2vw, 3rem); font-weight: 600; }
        .tv-tri { display: inline-flex; flex-wrap: wrap; gap: 0 .9em; }
        .tv-tri span:first-child { color: var(--ink); }
        .tv-label { font-size: clamp(1rem, 1.5vw, 1.5rem); color: var(--muted); font-weight: 600; margin: 0 0 1.2vh; }
        .tv-label .tv-tri span:first-child { color: var(--warn-ink); }
        .tv-counters { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.5vw; }
        .tv-counter { background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius-lg); padding: 1.8vh 1.5vw; text-align: center; }
        .tv-counter.busy { border-color: var(--warn-line); }
        .tv-counter.flash { animation: tv-flash 1s ease-in-out 4; }
        @keyframes tv-flash { 50% { opacity: .35; transform: scale(.985); } }
        .tv-counter-name { display: flex; justify-content: center; font-size: clamp(.95rem, 1.5vw, 1.5rem); color: var(--muted); font-weight: 600; }
        .tv-token { font-family: var(--font-mono); font-size: clamp(2.6rem, 7.2vw, 8rem); font-weight: 700; line-height: 1.12; color: var(--warn-ink); }
        .tv-free { display: flex; justify-content: center; font-size: clamp(1.2rem, 2.4vw, 2.2rem); color: var(--muted); font-weight: 600; padding: 2.4vh 0; }
        .tv-next-section { flex: 1; min-height: 0; overflow: hidden; }
        .tv-next { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 1vw; }
        .tv-next li { background: var(--surface); border-radius: var(--radius); padding: 1.2vh 1.2vw; display: flex; flex-direction: column; gap: 2px; }
        .tv-next-token { font-family: var(--font-mono); font-size: clamp(1.4rem, 2.5vw, 2.4rem); font-weight: 700; white-space: nowrap; line-height: 1.2; }
        .tv-next-eta { color: var(--muted); font-size: clamp(.9rem, 1.3vw, 1.3rem); white-space: nowrap; }
        .tv-stat { text-align: right; }
        .tv-stat-label { color: var(--muted); font-size: clamp(.75rem, 1vw, 1rem); }
        .tv-stat .tv-tri { justify-content: flex-end; }
        .tv-stat-value { font-size: clamp(1.4rem, 2.4vw, 2.4rem); font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
        .tv-next li.tv-empty { background: none; color: var(--muted); font-size: clamp(1rem, 1.6vw, 1.4rem); padding-left: 0; }
        .tv-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px 24px; flex-wrap: wrap; color: var(--muted); font-size: clamp(.9rem, 1.2vw, 1.2rem); border-top: 1px solid var(--line); padding-top: 1.6vh; }
        .tv-foot-right { display: flex; gap: 16px; align-items: center; }
        .tv-picker { max-width: 640px; margin: 10vh auto; padding: 0 16px; }
        .tv-picker a { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 12px; font-size: 1.2rem; font-weight: 600; text-decoration: none; }
        .tv-picker a:hover { border-color: var(--accent); }
        @media (max-width: 800px) { .tv-wrap { height: auto; overflow: visible; } }
    </style>
</head>
<body class="tv">

<!-- Shown when no centre is chosen: /display.html -->
<div id="picker" class="tv-picker hidden">
    <h1>Queue display</h1>
    <p class="tv-sub">Choose the centre for this screen:</p>
    <div id="centre-links"></div>
</div>

<!-- The board: /display.html?centre=1 -->
<div id="board" class="tv-wrap hidden">
    <header class="tv-head">
        <div>
            <div class="tv-centre" id="centre-name"></div>
            <div class="tv-sub">Smart Farmer Procurement System</div>
        </div>
        <div class="tv-head-right">
            <div class="tv-stat">
                <div class="tv-stat-label"><span class="tv-tri"><span>Waiting</span><span lang="ta">காத்திருப்பு</span><span lang="hi">प्रतीक्षा</span></span></div>
                <div class="tv-stat-value" id="waiting-count">0</div>
            </div>
            <div class="tv-stat">
                <div class="tv-stat-label"><span class="tv-tri"><span>Avg wait</span><span lang="ta">சராசரி</span><span lang="hi">औसत</span></span></div>
                <div class="tv-stat-value" id="avg-wait">0 min</div>
            </div>
            <div class="tv-stat">
                <div class="tv-stat-label"><span class="tv-tri"><span>Served</span><span lang="ta">சேவை</span><span lang="hi">सेवा</span></span></div>
                <div class="tv-stat-value" id="served">0</div>
            </div>
            <div class="tv-clock" id="clock"></div>
        </div>
    </header>

    <section>
        <h2 class="tv-label"><span class="tv-tri"><span>Now serving</span><span lang="ta">இப்போது</span><span lang="hi">अभी</span></span></h2>
        <div class="tv-counters" id="serving"></div>
    </section>

    <section class="tv-next-section">
        <h2 class="tv-label"><span class="tv-tri"><span>Next</span><span lang="ta">அடுத்து</span><span lang="hi">अगला</span></span></h2>
        <ol class="tv-next" id="next"></ol>
    </section>

    <footer class="tv-foot">
        <span class="tv-tri"><span>Show your token at the counter</span><span lang="ta">டோக்கனை கவுண்டரில் காட்டுங்கள்</span><span lang="hi">अपना टोकन काउंटर पर दिखाएँ</span></span>
        <span class="tv-foot-right">
            <span class="live-status offline" id="live-status"><span class="live-dot"></span><span id="live-text">Connecting…</span></span>
            <button type="button" class="btn btn-quiet btn-sm" id="sound-btn">Turn sound on</button>
        </span>
    </footer>
</div>

<script src="/js/live.js"></script>
<script src="/js/pages/display.js"></script>
</body>
</html>
