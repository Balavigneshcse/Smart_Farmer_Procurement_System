<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
  <!-- Faint wallpaper of crop sprigs (paddy, wheat, leaves), repeated behind every page. -->
  <g fill="none" stroke="#1e6b3a" stroke-linecap="round" opacity=".075">
    <!-- paddy stalk with a drooping head of grains -->
    <path d="M34 200 C 34 160 37 120 50 92 C 58 76 72 70 84 78" stroke-width="2"/>
    <path d="M52 88 C 60 76 72 72 83 79" stroke-width="5" stroke-dasharray="3.5 2.6"/>
    <path d="M34 200 C 30 176 20 160 8 150" stroke-width="2"/>
    <path d="M35 190 C 42 170 54 158 68 152" stroke-width="2"/>

    <!-- wheat ear -->
    <path d="M150 104 C 152 80 154 60 156 30" stroke-width="2"/>
    <path d="M156 34 L156 76" stroke-width="5" stroke-dasharray="3.5 2.4"/>
    <path d="M149 40 L148 74" stroke-width="4" stroke-dasharray="3 3"/>
    <path d="M163 40 L164 74" stroke-width="4" stroke-dasharray="3 3"/>
    <path d="M156 30 L154 14 M149 40 L144 26 M163 40 L168 26" stroke-width="1.2"/>

    <!-- small leaves -->
    <path d="M120 190 C 128 172 146 166 160 170 C 150 186 134 194 120 190 Z" stroke-width="1.8"/>
    <path d="M186 150 C 196 140 210 140 216 146 C 208 156 196 158 186 150 Z" stroke-width="1.6"/>
    <path d="M96 30 C 100 18 112 12 122 14 C 118 26 106 34 96 30 Z" stroke-width="1.6"/>

    <!-- grain dots -->
    <circle cx="190" cy="206" r="2.2" fill="#1e6b3a" stroke="none"/>
    <circle cx="198" cy="200" r="2.2" fill="#1e6b3a" stroke="none"/>
    <circle cx="96" cy="130" r="2" fill="#1e6b3a" stroke="none"/>
    <circle cx="14" cy="40" r="2" fill="#1e6b3a" stroke="none"/>
    <circle cx="22" cy="34" r="2" fill="#1e6b3a" stroke="none"/>
  </g>
</svg>
