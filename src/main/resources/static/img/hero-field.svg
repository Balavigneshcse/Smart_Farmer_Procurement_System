<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="340" viewBox="0 0 1440 340" preserveAspectRatio="xMidYMax slice">
  <!-- Paddy fields at dusk: layered hills, terrace rows and paddy plants in front. For dark green backgrounds. -->
  <defs>
    <!-- a clump of rice leaves, drawn from its root at (0,0) -->
    <g id="blades" fill="none" stroke-linecap="round">
      <path d="M0 0 C -1 -30 -8 -58 -24 -84" stroke-width="3"/>
      <path d="M0 0 C 1 -38 2 -70 8 -104" stroke-width="3.2"/>
      <path d="M0 0 C 4 -28 14 -52 32 -70" stroke-width="3"/>
      <path d="M0 0 C -5 -22 -18 -38 -38 -48" stroke-width="2.6"/>
      <path d="M0 0 C 6 -18 20 -30 40 -34" stroke-width="2.4"/>
    </g>
    <!-- a ripe paddy stalk: the head of grain bends over -->
    <g id="stalk" fill="none" stroke-linecap="round">
      <path d="M0 0 C 0 -50 4 -96 18 -120 C 24 -130 34 -131 40 -123" stroke="#3f9d61" stroke-width="2.4"/>
      <path d="M40 -123 C 42 -112 42 -100 41 -88" stroke="#c98a06" stroke-width="1.2"/>
      <g fill="#e3a008" stroke="none">
        <ellipse cx="40" cy="-119" rx="2.8" ry="5" transform="rotate(-20 40 -119)"/>
        <ellipse cx="44.5" cy="-113" rx="2.8" ry="5" transform="rotate(25 44.5 -113)"/>
        <ellipse cx="38.5" cy="-109" rx="2.7" ry="4.8" transform="rotate(-25 38.5 -109)"/>
        <ellipse cx="44" cy="-103" rx="2.6" ry="4.6" transform="rotate(25 44 -103)"/>
        <ellipse cx="39" cy="-99" rx="2.5" ry="4.4" transform="rotate(-25 39 -99)"/>
        <ellipse cx="43" cy="-93" rx="2.3" ry="4.1" transform="rotate(20 43 -93)"/>
        <ellipse cx="40.5" cy="-88.5" rx="2" ry="3.6" transform="rotate(-15 40.5 -88.5)"/>
      </g>
    </g>
    <g id="plant">
      <use xlink:href="#blades" stroke="#2f8a50"/>
      <use xlink:href="#stalk" x="2"/>
      <use xlink:href="#stalk" x="-4" transform="scale(-.85 .9)"/>
    </g>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25804a" stop-opacity=".0"/>
      <stop offset="1" stop-color="#25804a" stop-opacity=".45"/>
    </linearGradient>
  </defs>

  <!-- far hills -->
  <path d="M0 176 C 160 128 330 150 520 138 C 700 126 860 92 1060 118 C 1240 142 1350 124 1440 132 L1440 340 L0 340 Z" fill="#25804a" opacity=".35"/>
  <!-- terraced fields -->
  <path d="M0 222 C 240 186 480 212 720 200 C 960 188 1200 172 1440 194 L1440 340 L0 340 Z" fill="url(#haze)"/>
  <path d="M0 222 C 240 186 480 212 720 200 C 960 188 1200 172 1440 194" fill="none" stroke="#dff0e3" stroke-opacity=".18" stroke-width="2"/>
  <path d="M0 246 C 260 214 520 236 760 226 C 1000 216 1220 204 1440 220" fill="none" stroke="#dff0e3" stroke-opacity=".14" stroke-width="2"/>
  <path d="M0 268 C 280 242 560 258 800 250 C 1040 242 1240 234 1440 244" fill="none" stroke="#dff0e3" stroke-opacity=".1" stroke-width="2"/>
  <!-- near ground -->
  <path d="M0 292 C 300 272 620 286 920 278 C 1160 272 1320 266 1440 270 L1440 340 L0 340 Z" fill="#12351f" opacity=".85"/>

  <!-- paddy plants in front -->
  <g transform="translate(0 340)">
    <use xlink:href="#plant" x="40" transform="scale(1)"/>
    <use xlink:href="#plant" x="120" y="4" transform="scale(1)"/>
    <use xlink:href="#blades" x="190" stroke="#2f8a50" transform="scale(1)"/>
    <use xlink:href="#plant" x="270" transform="scale(1)"/>
    <use xlink:href="#plant" x="360" y="6"/>
    <use xlink:href="#blades" x="430" stroke="#2f8a50"/>
    <use xlink:href="#plant" x="500"/>
    <use xlink:href="#plant" x="590" y="4"/>
    <use xlink:href="#blades" x="660" stroke="#2f8a50"/>
    <use xlink:href="#plant" x="740"/>
    <use xlink:href="#plant" x="830" y="6"/>
    <use xlink:href="#blades" x="900" stroke="#2f8a50"/>
    <use xlink:href="#plant" x="970"/>
    <use xlink:href="#plant" x="1060" y="4"/>
    <use xlink:href="#blades" x="1130" stroke="#2f8a50"/>
    <use xlink:href="#plant" x="1210"/>
    <use xlink:href="#plant" x="1300" y="6"/>
    <use xlink:href="#blades" x="1370" stroke="#2f8a50"/>
    <use xlink:href="#plant" x="1430"/>
  </g>
</svg>
