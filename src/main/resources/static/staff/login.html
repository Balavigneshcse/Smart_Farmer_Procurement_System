<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Staff login · Smart Farmer Procurement System</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<header class="site-header">
    <div class="container header-row">
        <a class="brand" href="/">
            <span class="brand-mark">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 21V11"/>
                    <path d="M12 11C12 7 9 4 4 4c0 4 3 7 8 7z"/>
                    <path d="M12 14c0-4 3-7 8-7 0 4-3 7-8 7z"/>
                </svg>
            </span>
            <span class="brand-text">Smart Farmer Procurement System</span>
        </a>
    </div>
</header>

<main class="container auth-wrap">
    <form id="login-form" class="card auth-card" novalidate>
        <h1 class="auth-title">Staff login</h1>
        <p class="muted">For procurement centre operators and administrators.</p>

        <div id="alert" class="alert hidden" role="alert"></div>

        <div class="field">
            <label for="username">Username</label>
            <input id="username" autocomplete="username" autocapitalize="none" spellcheck="false" aria-describedby="username-error">
            <p class="field-error" id="username-error"></p>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <div class="input-group">
                <input id="password" class="has-suffix" type="password" autocomplete="current-password" aria-describedby="password-error">
                <button type="button" class="input-suffix" id="toggle-password" aria-label="Show password">Show</button>
            </div>
            <p class="field-error" id="password-error"></p>
        </div>

        <button class="btn btn-primary btn-lg btn-block" type="submit" id="login-btn">Log in</button>
    </form>
    <p class="auth-footer small muted">Farmer? <a href="/farmer/login.html">Log in with your mobile number</a></p>
</main>

<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script>
    const $ = id => document.getElementById(id);

    // Already logged in as staff? Go straight to the right page.
    const current = Auth.user();
    if (current && current.role !== 'FARMER') {
        location.replace(Auth.homeFor(current.role));
    }

    function showAlert(text, type = 'error') {
        $('alert').textContent = text;
        $('alert').className = `alert alert-${type}`;
    }

    function setFieldError(id, text) {
        $(id).setAttribute('aria-invalid', 'true');
        $(`${id}-error`).textContent = text;
    }

    function clearErrors() {
        $('alert').className = 'alert hidden';
        ['username', 'password'].forEach(id => {
            $(id).removeAttribute('aria-invalid');
            $(`${id}-error`).textContent = '';
        });
    }

    $('toggle-password').addEventListener('click', () => {
        const show = $('password').type === 'password';
        $('password').type = show ? 'text' : 'password';
        $('toggle-password').textContent = show ? 'Hide' : 'Show';
        $('toggle-password').setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    });

    $('login-form').addEventListener('submit', async event => {
        event.preventDefault();
        clearErrors();
        const username = $('username').value.trim();
        const password = $('password').value;
        if (!username) setFieldError('username', 'Enter your username.');
        if (!password) setFieldError('password', 'Enter your password.');
        if (!username || !password) return;

        const button = $('login-btn');
        button.disabled = true;
        button.textContent = 'Logging in…';
        try {
            const result = await Api.post('/api/auth/login', { username, password });
            Auth.save(result.token, result.user);
            location.replace(Auth.homeFor(result.user.role));
        } catch (error) {
            showAlert(Api.errorMessage(error));
            $('password').value = '';
            $('password').focus();
            button.disabled = false;
            button.textContent = 'Log in';
        }
    });

    if (new URLSearchParams(location.search).get('expired')) {
        showAlert('Your session has ended. Please log in again.', 'info');
    }
    $('username').focus();
</script>
</body>
</html>
