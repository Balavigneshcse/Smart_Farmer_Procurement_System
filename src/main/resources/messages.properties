# Email and notification texts in English (default). Tamil: messages_ta.properties, Hindi: messages_hi.properties
# {0}, {1} ... are filled in by the code. Do not use the apostrophe character in these texts (it has a special meaning here).
#
# Every booking notification gets the same first values:
#   {0} token   {1} centre   {2} day   {3} slot time   {4} crop
# and some add their own values as {5} and {6}.

notify.app-name=Smart Farmer Procurement System
notify.greeting=Hello {0},
notify.button=Open my booking
notify.footer=You are getting this email because you registered with the Smart Farmer Procurement System. Please do not reply to this email.

# {0} code, {1} minutes
notify.otp.subject={0} is your login OTP
notify.otp.text=Use this OTP to log in to the Smart Farmer Procurement System. It is valid for {1} minutes. Never share it with anyone, not even with centre staff.
notify.otp.footer=If you did not try to log in, you can ignore this email.

notify.booking-confirmed.subject=Booking confirmed - token {0}
notify.booking-confirmed.text=Your slot is booked at {1} on {2}, {3}. Crop: {4}. Your token is {0}. At the centre, show the QR code on your booking page or tell your token.

notify.booking-cancelled.subject=Booking cancelled - token {0}
notify.booking-cancelled.text=Your booking {0} at {1} on {2}, {3} has been cancelled. You can book another time whenever you are ready.

notify.reminder.subject=Reminder: token {0} today, {3}
notify.reminder.text=Your slot at {1} is today, {3}. Token {0}, crop: {4}. Please come on time and bring your crop dry and clean.

# {5} position in the queue, {6} minutes of waiting
notify.checked-in.subject=Checked in - token {0}
notify.checked-in.text=You are checked in at {1}. You are number {5} in the queue. Expected wait: about {6} min. Watch the TV screen or your booking page.

notify.turn-near.subject=Your turn is near - token {0}
notify.turn-near.text=Your turn at {1} is coming soon. You are number {5} in the queue, about {6} min left. Please stay near the counters with your crop.

# {5} counter number
notify.called.subject=Go to counter {5} now
notify.called.text=Token {0}: please go to counter {5} now with your crop.

# {5} weight in quintal, {6} amount
notify.procured.subject=Crop accepted - token {0}
notify.procured.text=Your crop was accepted at {1}. Crop: {4}. Weight: {5} quintal. Amount: {6}. The payment will be made to you soon.

# {5} reason
notify.rejected.subject=Crop not accepted - token {0}
notify.rejected.text=Sorry, your crop was not accepted at {1}. Crop: {4}. Reason: {5}. You can book a new slot after fixing the problem.

# {5} amount, {6} payment reference
notify.paid.subject=Payment done - {5}
notify.paid.text=The payment of {5} for your crop has been made. Token {0}, crop: {4}. Payment reference: {6}.

notify.no-show.subject=Missed slot - token {0}
notify.no-show.text=You did not come to {1} for your slot on {2}, {3} (token {0}), so the booking has been closed. Please book a new slot when you are ready.
