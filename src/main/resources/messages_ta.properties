# Email and notification texts in Tamil. The values {0}, {1} ... are the same as in messages.properties.

notify.app-name=ஸ்மார்ட் விவசாயி கொள்முதல் அமைப்பு
notify.greeting=வணக்கம் {0},
notify.button=என் முன்பதிவைத் திறக்க
notify.footer=நீங்கள் ஸ்மார்ட் விவசாயி கொள்முதல் அமைப்பில் பதிவு செய்துள்ளதால் இந்த மின்னஞ்சல் அனுப்பப்பட்டது. இந்த மின்னஞ்சலுக்குப் பதில் அனுப்ப வேண்டாம்.

notify.otp.subject={0} - உங்கள் உள்நுழைவு OTP
notify.otp.text=ஸ்மார்ட் விவசாயி கொள்முதல் அமைப்பில் உள்நுழைய இந்த OTP-ஐப் பயன்படுத்துங்கள். இது {1} நிமிடங்கள் மட்டுமே செல்லுபடியாகும். நிலைய ஊழியர்கள் உட்பட யாருடனும் இதைப் பகிர வேண்டாம்.
notify.otp.footer=நீங்கள் உள்நுழைய முயற்சிக்கவில்லை என்றால், இந்த மின்னஞ்சலைப் புறக்கணிக்கலாம்.

notify.booking-confirmed.subject=முன்பதிவு உறுதி - டோக்கன் {0}
notify.booking-confirmed.text={1}-இல் {2}, {3} நேரத்திற்கு உங்கள் முன்பதிவு உறுதி செய்யப்பட்டது. பயிர்: {4}. உங்கள் டோக்கன் {0}. நிலையத்தில் உங்கள் முன்பதிவுப் பக்கத்தில் உள்ள QR குறியீட்டைக் காட்டுங்கள் அல்லது டோக்கன் எண்ணைச் சொல்லுங்கள்.

notify.booking-cancelled.subject=முன்பதிவு ரத்து - டோக்கன் {0}
notify.booking-cancelled.text={1}-இல் {2}, {3} நேரத்திற்கான உங்கள் முன்பதிவு {0} ரத்து செய்யப்பட்டது. நீங்கள் தயாரானதும் வேறு நேரத்தை முன்பதிவு செய்யலாம்.

notify.reminder.subject=நினைவூட்டல்: டோக்கன் {0} இன்று, {3}
notify.reminder.text={1}-இல் உங்கள் நேரம் இன்று {3}. டோக்கன் {0}, பயிர்: {4}. உலர்ந்த, சுத்தமான பயிருடன் சரியான நேரத்தில் வாருங்கள்.

notify.checked-in.subject=வருகை பதிவு செய்யப்பட்டது - டோக்கன் {0}
notify.checked-in.text={1}-இல் உங்கள் வருகை பதிவு செய்யப்பட்டது. வரிசையில் நீங்கள் {5}-வது இடத்தில் உள்ளீர்கள். காத்திருப்பு: சுமார் {6} நிமி. TV திரையையோ உங்கள் முன்பதிவுப் பக்கத்தையோ பாருங்கள்.

notify.turn-near.subject=உங்கள் முறை நெருங்குகிறது - டோக்கன் {0}
notify.turn-near.text={1}-இல் உங்கள் முறை விரைவில் வரும். வரிசையில் நீங்கள் {5}-வது இடத்தில் உள்ளீர்கள், சுமார் {6} நிமி மீதமுள்ளது. உங்கள் பயிருடன் கவுண்டர்களுக்கு அருகில் இருங்கள்.

notify.called.subject=இப்போது கவுண்டர் {5}-க்குச் செல்லுங்கள்
notify.called.text=டோக்கன் {0}: உங்கள் பயிருடன் இப்போதே கவுண்டர் {5}-க்குச் செல்லுங்கள்.

notify.procured.subject=பயிர் ஏற்றுக்கொள்ளப்பட்டது - டோக்கன் {0}
notify.procured.text={1}-இல் உங்கள் பயிர் ஏற்றுக்கொள்ளப்பட்டது. பயிர்: {4}. எடை: {5} குவிண்டால். தொகை: {6}. பணம் விரைவில் உங்களுக்கு அனுப்பப்படும்.

notify.rejected.subject=பயிர் ஏற்றுக்கொள்ளப்படவில்லை - டோக்கன் {0}
notify.rejected.text=மன்னிக்கவும், {1}-இல் உங்கள் பயிர் ஏற்றுக்கொள்ளப்படவில்லை. பயிர்: {4}. காரணம்: {5}. பிரச்சனையைச் சரிசெய்த பிறகு புதிய நேரத்தை முன்பதிவு செய்யலாம்.

notify.paid.subject=பணம் செலுத்தப்பட்டது - {5}
notify.paid.text=உங்கள் பயிருக்கான {5} தொகை செலுத்தப்பட்டது. டோக்கன் {0}, பயிர்: {4}. பரிவர்த்தனை குறிப்பு: {6}.

notify.no-show.subject=முன்பதிவு நேரம் தவறியது - டோக்கன் {0}
notify.no-show.text={2}, {3} நேரத்திற்கு நீங்கள் {1}-க்கு வரவில்லை (டோக்கன் {0}), எனவே முன்பதிவு மூடப்பட்டது. தயாரானதும் புதிய நேரத்தை முன்பதிவு செய்யுங்கள்.
