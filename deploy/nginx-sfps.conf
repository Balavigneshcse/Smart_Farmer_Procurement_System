# Nginx in front of the app (installed by setup-ec2.sh; Certbot adds the HTTPS part).

# Login rate limits, counted per visitor IP address. These two lines stay outside server{}:
# Ubuntu reads this file inside the http{} block of /etc/nginx/nginx.conf.
# The limits are generous on purpose: many mobile users in India share one public IP address
# (carrier-grade NAT), so one "visitor" can really be a whole village. They only stop floods;
# the app has its own limits per email and per account behind them.
#   sfps_otp    sending an OTP email:                6 a minute, plus a burst of 12 at once
#   sfps_login  checking an OTP or a staff password: 20 a minute, plus a burst of 20 at once
# 1 MB of memory remembers about 16,000 addresses.
limit_req_zone $binary_remote_addr zone=sfps_otp:1m rate=6r/m;
limit_req_zone $binary_remote_addr zone=sfps_login:1m rate=20r/m;

server {
    listen 80;
    server_name __DOMAIN__;
    client_max_body_size 2m;

    # Over the limit: answer 429 with JSON like the app's own errors, so the pages can show the message.
    # This only replaces 429s made by Nginx itself. A 429 from the app (OTP_COOLDOWN, LOGIN_LOCKED...)
    # passes through unchanged, because proxy_intercept_errors is off (the default).
    limit_req_status 429;
    error_page 429 = @too_many;

    # Every location that passes requests to the app sends the same four headers. The app takes the
    # visitor's real IP from X-Forwarded-For (it locks staff logins per IP); without it every visitor
    # would look like 127.0.0.1. Nginx drops server-level proxy_set_header lines in a location that has
    # its own (the live queue needs one), so each location lists all four. Copy them into any new location.

    # nodelay: requests inside the burst are answered at once instead of being slowed down.
    location = /api/auth/otp/send {
        limit_req zone=sfps_otp burst=12 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/otp/verify {
        limit_req zone=sfps_login burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/login {
        limit_req zone=sfps_login burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Live queue (Server-Sent Events): pass every update through at once and keep the connection open.
    location ~ ^/api/queue/.+/stream$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The answer for requests over the limit (contract with the pages: code RATE_LIMITED).
    location @too_many {
        default_type application/json;
        return 429 '{"status":429,"code":"RATE_LIMITED","message":"Too many attempts. Please wait a minute and try again."}';
    }
}
